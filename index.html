  <body>
    <!-- Filled at build time by scripts/prerender.mjs (one page per route and language). -->
    <div id="root"></div>
    <script>
      // Restore a /jeux/<slug> URL rewritten by 404.html (GitHub Pages SPA fallback).
      (function () {
        var q = window.location.search;
        if (q && q.indexOf('?/') === 0) {
          var path = q.slice(2).split('&')[0].replace(/~and~/g, '&');
          window.history.replaceState(null, '', '/' + path + window.location.hash);
        }
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
