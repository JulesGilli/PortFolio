<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Jules Gilli</title>
    <script>
      // GitHub Pages SPA fallback: send /jeux/<slug> to index.html with the path in the query.
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?/' + l.pathname.slice(1).replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
    </script>
  </head>
  <body></body>
</html>
